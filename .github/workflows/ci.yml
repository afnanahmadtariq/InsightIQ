name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/combine-shapator

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightiq?schema=public

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: insightiq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insightiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Generate database client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run check-types

      - name: Build API
        run: npm run build -- --filter=@insightiq/api

      - name: Run API unit tests
        working-directory: apps/api
        run: node --test test/*.test.cjs

      - name: Run integration tests
        working-directory: apps/api
        env:
          INTEGRATION_TESTS: "true"
        run: node --test test/*.integration.test.cjs

      - name: Setup worker
        run: npm run worker:setup

      - name: Run worker tests
        run: npm run test -- --filter=@insightiq/worker

  e2e-mock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps

      - name: Build web
        run: npm run build -- --filter=@insightiq/web

      - name: Run Playwright mock journey
        working-directory: apps/web
        env:
          CI: "true"
          HOSTNAME: "127.0.0.1"
        run: npx playwright test e2e/smoke.spec.ts e2e/deal-brief-journey.spec.ts

  e2e-real-stack:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: insightiq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insightiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate database client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps

      - name: Build web
        run: npm run build -- --filter=@insightiq/web

      - name: Run Playwright real-stack journey
        working-directory: apps/web
        env:
          CI: "true"
          HOSTNAME: "127.0.0.1"
          E2E_USE_REAL_STACK: "true"
          E2E_ENABLED: "true"
          E2E_SEED_SECRET: e2e-local-secret-ok
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightiq?schema=public
          BETTER_AUTH_SECRET: ci-better-auth-secret-minimum-32-chars
          BETTER_AUTH_URL: http://127.0.0.1:3001
          WEB_ORIGIN: http://127.0.0.1:3000
        run: npx playwright test e2e/research-journey.spec.ts

name: Deploy Cloudflare (Frontend)

on:
  push:
    tags:
      - "v*"

  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - "apps/web/wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install dependencies (workspace)
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace=@insightiq/web

      - name: Check frontend types
        run: npm run check-types --workspace=@insightiq/web

      - name: Run frontend tests when present
        run: npm run test --if-present --workspace=@insightiq/web

      - name: Build frontend
        run: npm run build --workspace=@insightiq/web

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install dependencies (workspace)
        run: npm ci

      - name: Build OpenNext (Cloudflare)
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NODE_ENV: production
        working-directory: apps/web
        run: npm run cf:build --workspace=@insightiq/web

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run cf:deploy --workspace=@insightiq/web

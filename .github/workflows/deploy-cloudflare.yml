name: Deploy Cloudflare (Frontend)

concurrency:
  group: deploy-web-${{ github.ref_type == 'tag' && 'production' || github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - "apps/web/wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install dependencies (workspace)
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps

      - name: Lint frontend
        run: npm run lint --workspace=@insightiq/web

      - name: Check frontend types
        run: npm run check-types --workspace=@insightiq/web

      - name: Run frontend tests when present
        run: npm run test --if-present --workspace=@insightiq/web

      - name: Build frontend
        run: npm run build --workspace=@insightiq/web

      - name: Build Cloudflare artifact
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api-insightiq.zerotools.online
          NODE_ENV: production
        run: npm run cf:build --workspace=@insightiq/web

      - name: Validate Cloudflare artifact
        working-directory: apps/web
        run: npx wrangler deploy --dry-run

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install dependencies (workspace)
        run: npm ci

      - name: Validate deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          case "$NEXT_PUBLIC_API_URL" in
            https://*) ;;
            *) echo "NEXT_PUBLIC_API_URL must be a non-empty HTTPS URL" >&2; exit 1 ;;
          esac

      - name: Build OpenNext (Cloudflare)
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NODE_ENV: production
        working-directory: apps/web
        run: npm run cf:build --workspace=@insightiq/web

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run cf:deploy --workspace=@insightiq/web

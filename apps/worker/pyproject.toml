[project]
name = "insightiq-worker"
version = "0.0.0"
requires-python = ">=3.9"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "langgraph>=0.2",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "crawl4ai>=0.4",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]

[project.scripts]
insightiq-demo-collect = "insightiq_worker.demo:main"
insightiq-process-run = "insightiq_worker.process_run:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
